# Empacotamento do Aprova como app de celular (Android e iPhone) com o Flet.
# No computador o Aprova continua abrindo pelo "Abrir Aprova.bat" / python main.py (requirements.txt).
#
#   flet build apk            APK para instalar direto no Android
#   flet build aab            pacote para a Google Play
#   flet build ios-simulator  app para o simulador do iPhone (macOS)
#   flet build ipa            iPhone (macOS, com conta Apple Developer, certificado e perfil)
#
# O robô do GitHub (.github/workflows/celular.yml) monta o APK e testa o iPhone a cada versão.

[project]
name = "aprova"
version = "1.25.0"
description = "Estudo para concursos públicos: provas, revisão, metas, grupos e o seu personagem em pixel art."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NatanaelSantz" }]
dependencies = [
    "flet==1.0.5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "ddgs>=9.0",
    "anthropic>=0.40",
    "qrcode[pil]>=7.4",
    "pillow>=10.0",
]

[tool.flet]
org = "io.github.natanaelsantz"
product = "Aprova"
artifact = "aprova"
company = "NatanaelSantz"
copyright = "Copyright (C) 2026 NatanaelSantz"

[tool.flet.app]
path = "."
module = "main"
# só o app vai para o celular: testes, site, ferramentas e atalhos do Windows ficam de fora
exclude = ["tests", "docs", "ferramentas", "supabase", "build", "Abrir Aprova.bat", "Abrir no celular.bat", "iniciar.pyw", "iniciar.sh"]

[tool.flet.splash]
color = "#F4F6FA"
dark_color = "#141C33"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.VIBRATE" = true  # o celular vibra quando um alarme toca

# Testes do Aprova no Windows (o sistema de quase todo mundo que usa o app), a cada envio para a main.
name: Testes no Windows

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      # sem PYTHONUTF8: o teste vê o Windows como ele é na casa das pessoas (acentos, cp1252)
      - run: python -m pytest -q tests

# Monta o Aprova para celular a cada versão:
# - Android: um APK para instalar direto (sai como artefato desta execução);
# - iPhone: o app para o simulador (confere que o build do iOS funciona; o iPhone de verdade
#   precisa da conta Apple Developer, do certificado e do perfil de distribuição).
name: App do celular

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aprova/**"
      - "main.py"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/celular.yml"

permissions:
  contents: read

concurrency:
  group: celular-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write  # põe o APK na página da versão (link direto para baixar no celular)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Flet
        run: pip install "flet[cli]==1.0.5"

      - name: Versão
        id: versao
        run: echo "valor=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('aprova/__init__.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"

      # um APK por tipo de processador (bem menor que um só para todos): arm64 é o dos celulares de hoje,
      # armeabi-v7a o dos mais antigos; x86_64 (emuladores) fica de fora
      - name: Montar o APK
        run: >-
          flet build apk --yes --no-rich-output --skip-flutter-doctor --split-per-abi --cleanup-packages
          --arch arm64-v8a armeabi-v7a
          --build-version "${{ steps.versao.outputs.valor }}" --build-number "${{ github.run_number }}" -v

      - name: Dar nome aos APKs
        run: |
          mkdir -p saida
          ls -la build/apk
          V="${{ steps.versao.outputs.valor }}"
          for f in build/apk/*.apk; do
            case "$f" in
              *arm64*) cp "$f" "saida/Aprova-$V-android.apk" ;;
              *armeabi*) cp "$f" "saida/Aprova-$V-android-antigo.apk" ;;
            esac
          done
          ls -la saida

      # Na página da versão (Releases), ao lado do Aprova.zip: o link
      # github.com/NatanaelSantz/aprova/releases/latest/download/Aprova-android.apk sempre leva ao último.
      # (Antes ia para um ramo "apk", e esse passo falhava; a página da versão aceita arquivos grandes e não pesa no repositório.)
      # Só o envio que é a própria versão publicada sobe; os outros ficam só como artefato desta execução.
      - name: Guardar na página da versão (link direto para baixar no celular)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.versao.outputs.valor }}"
          git fetch -q --tags origin || true
          if [ "$(git rev-list -n1 "v$V" 2>/dev/null)" != "$GITHUB_SHA" ]; then
            echo "Este envio não é o da versão v$V: o APK fica só como artefato."
            exit 0
          fi
          for i in $(seq 1 20); do gh release view "v$V" >/dev/null 2>&1 && break; sleep 15; done
          cp "saida/Aprova-$V-android.apk" Aprova-android.apk
          cp "saida/Aprova-$V-android-antigo.apk" Aprova-android-antigo.apk
          ls -la Aprova-android*.apk
          gh release upload "v$V" Aprova-android.apk Aprova-android-antigo.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: aprova-android
          path: saida/*.apk
          retention-days: 30

  iphone:
    name: iPhone (simulador)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o Flet
        run: pip install "flet[cli]==1.0.5"

      - name: Versão
        id: versao
        run: echo "valor=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('aprova/__init__.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Montar para o simulador do iPhone
        run: flet build ios-simulator --yes --no-rich-output --skip-flutter-doctor --build-version "${{ steps.versao.outputs.valor }}" --build-number "${{ github.run_number }}" -v

      - name: Compactar
        run: |
          mkdir -p saida
          cd build/ios-simulator && zip -qr "../../saida/Aprova-${{ steps.versao.outputs.valor }}-simulador-iphone.zip" . && cd ../..
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: aprova-iphone-simulador
          path: saida/*.zip
          retention-days: 30
